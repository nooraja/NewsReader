name: NewsReader
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  NewsReader:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nooraja.newsreader
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/App-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: NewsReader
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  NewsReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: NewsReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nooraja.newsreader.tests
        GENERATE_INFOPLIST_FILE: YES
  NewsReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies:
      - target: NewsReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nooraja.newsreader.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NewsReader:
    build:
      targets:
        NewsReader: all
    test:
      targets: [NewsReaderTests, NewsReaderUITests]
  Offline Demo:
    build:
      targets:
        NewsReader: all
    run:
      config: Debug
      commandLineArguments:
        "-demo": true
    test:
      targets: [NewsReaderTests, NewsReaderUITests]
